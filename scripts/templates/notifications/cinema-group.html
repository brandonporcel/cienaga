<!-- Cinema Group Header -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
    style="margin-bottom: 16px;">
    <tr>
        <td style="padding: 16px 20px 12px 20px; background-color: #111827; border-radius: 10px 10px 0 0; border-bottom: 2px solid #d97706;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                    <td style="vertical-align: middle;">
                        {{cinema_logo}}
                        <span style="font-size: 17px; font-weight: 700; color: #f9fafb; letter-spacing: -0.01em;">
                            {{cinema_name}}
                        </span>
                    </td>
                    <td align="right" style="vertical-align: middle;">
                        <span style="font-size: 13px; color: #9ca3af; font-weight: 500;">
                            {{film_count}}
                        </span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
