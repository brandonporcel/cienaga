<!-- Compact Film Row -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
    style="margin-bottom: 1px; background-color: #ffffff;">
    <tr>
        <td width="56" style="padding: 12px 0 12px 16px; vertical-align: top;">
            <img src="{{thumbnail_url}}" alt="{{movie_title}}"
                style="width: 44px; height: 66px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.12);">
        </td>
        <td style="padding: 12px 16px 12px 12px; vertical-align: top;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                    <td>
                        <span style="font-size: 15px; font-weight: 600; color: #111827; line-height: 1.3;">
                            {{movie_title}}
                        </span>
                        <span style="font-size: 13px; color: #6b7280; margin-left: 6px;">
                            {{movie_year}}
                        </span>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 2px;">
                        <span style="font-size: 12px; color: #d97706; font-weight: 500;">
                            {{director_name}}
                        </span>
                        <span style="font-size: 12px; color: #9ca3af; margin-left: 4px;">•</span>
                        <span style="font-size: 12px; color: #6b7280; margin-left: 4px;">
                            {{formatted_date}}
                        </span>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 8px;">
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                {{screening_hours}}
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
<!-- Film Row Separator -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
        <td style="padding: 0 16px;">
            <div style="border-bottom: 1px solid #f3f4f6;"></div>
        </td>
    </tr>
</table>
